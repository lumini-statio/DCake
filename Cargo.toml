[package]
name = "wind-leaf"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
secrecy = "0.10.3"
serde_json = "1.0.154"
sha2 = "0.10"
slint = "1.19.0"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }

[build-dependencies]
slint-build = "1.19.0"
