[package]
name = "jaw-jo"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
secrecy = "0.10.3"
serde_json = "1.0.154"
slint = "1.19.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }
jsonwebtoken = "9"

[build-dependencies]
slint-build = "1.19.0"
